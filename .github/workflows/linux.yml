name: linux

on:
  push:
    branches:
      - main

  pull_request:

  schedule:
    - cron: "0 5 * * 1"  # runs at 05:00 UTC on Mondays

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config }} build on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        os: ["ubuntu-latest"]
        python-version: [3.12]
        config: ["Release"]

    steps:
      - uses: actions/checkout@v4

      - name: Timestamp  # Idea from https://tinyurl.com/47wz7vpv
        id: timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          message("::set-output name=now::${current_date}")

      - name: Configuring Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache
            /home/runner/conda_pkgs_dir
          key:
            ${{ runner.os }}-${{ matrix.config }}-${{ runner.python-version }}-${{ github.ref }}-ccache-${ { steps.timestamp.outputs.now } }
          restore-keys: |
            ${{ runner.os }}-${{ matrix.config }}-${{ runner.python-version }}-${{ github.ref }}-ccache-

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}

      - shell: bash -el {0}
        run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show
          printenv | sort

      - name: Configuring Conda Environment
        shell: bash -el {0}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          # conda-devenv is retired here: its `conda devenv` subcommand stopped registering under
          # current conda ("invalid choice: 'devenv'"), which broke every run. The environment is
          # now created directly, the way runtimes.yml already does, with environment.devenv.yml's
          # platform selectors resolved for this job (Linux/x64).
          conda create -y -n reaktoro -c conda-forge \
            python=${PYTHON_VERSION} pip \
            "autodiff>=1.1.1" catch2=2 ccache cmake cpp-tabulate eigen fire git ipykernel \
            matplotlib-base nbformat ninja nlohmann_json numpy openlibm optima=0.6.0 pandas \
            phreeqc4rkt "pybind11>=2.10.0" pybind11-abi pybind11-stubgen=2.0.2 pytest \
            pytest-regressions pytest-xdist "reaktplot>=0.4.1" thermofun=0.4.5 spdlog=1.12 \
            tsl_ordered_map yaml-cpp=0.8.0 \
            clangxx doxygen=1.9.1 graphviz gxx_linux-64 lld make valgrind
          conda activate reaktoro
          pip install oyaml

      - name: Building, Testing & Installing Reaktoro
        shell: bash -el {0}
        run: |
          conda activate reaktoro
          ccache -s
          ccache -z
          mkdir .build && cd .build
          cmake -GNinja .. -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          ninja
          ninja tests
          ninja examples/install
          ninja install
          ccache -s
