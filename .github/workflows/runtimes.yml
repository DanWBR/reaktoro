# Builds the flat C API and every shared library it needs at run time, one folder per .NET runtime
# identifier, and publishes them as the `runtimes` artifact.
#
# This is what DWSIM consumes: it vendors the folders under
# engine/DWSIM.Thermodynamics.ReaktoroPropertyPackage/native/<rid>/ and copies the one that matches
# what is being built next to the managed assembly.
#
# On demand and on tags only. The three workflows alongside this one already build and test Reaktoro
# on every push; this one exists to produce binaries, and producing them costs a lot of minutes.
#
# win-arm64 is missing on purpose. Reaktoro's dependencies come from conda-forge, and neither Optima
# nor phreeqc4rkt is built for that platform - conda-forge does not build for win-arm64 at all.
# Getting it would mean building the whole dependency chain from source for ARM64 Windows.

name: runtimes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the runtimes under. DWSIM pins this exact tag."
        required: true
        default: "runtimes-2.13.0"
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-2022,     compiler: "",                   autodiff: autodiff }
          - { rid: linux-x64,   os: ubuntu-22.04,     compiler: gxx_linux-64,         autodiff: autodiff }
          - { rid: linux-arm64, os: ubuntu-22.04-arm, compiler: gxx_linux-aarch64,    autodiff: ""       }
          - { rid: osx-x64,     os: macos-15-intel,   compiler: clangxx_osx-64,       autodiff: autodiff }
          - { rid: osx-arm64,   os: macos-14,         compiler: clangxx_osx-arm64,    autodiff: autodiff }

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ''

      # Only what the C++ library links against. The full development environment carries pytest,
      # matplotlib, Jupyter and the documentation toolchain, none of which ends up in what we ship.
      #
      # Python and pybind11 are here despite the Python package being off: ReaktoroFindDeps.cmake
      # marks both REQUIRED regardless, so configuring fails without them.
      - name: Installing dependencies
        shell: bash -el {0}
        run: |
          conda create -y -n reaktoro -c conda-forge \
            python=3.12 cmake ninja \
            ${{ matrix.autodiff }} eigen=3.4.* nlohmann_json optima=0.6.0 phreeqc4rkt cpp-tabulate \
            thermofun=0.4.5 tsl_ordered_map yaml-cpp=0.8.0 spdlog=1.12 pybind11 \
            ${{ matrix.compiler }}

      # conda-forge has no autodiff for linux-aarch64. It is header-only, so building it is quick
      # and it is the same version the package would have brought.
      - name: Building autodiff from source
        if: matrix.autodiff == ''
        shell: bash -el {0}
        run: |
          source activate reaktoro
          git clone --depth 1 --branch v1.1.2 https://github.com/autodiff/autodiff.git .autodiff
          cmake -S .autodiff -B .autodiff/build -GNinja             -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX             -DAUTODIFF_BUILD_TESTS=OFF             -DAUTODIFF_BUILD_PYTHON=OFF             -DAUTODIFF_BUILD_EXAMPLES=OFF             -DAUTODIFF_BUILD_DOCS=OFF
          cmake --install .autodiff/build

      # Windows takes its compiler from the runner rather than from conda: the runner has Visual
      # Studio and conda-forge's compiler packages for Windows are activation scripts that look for
      # a version it does not have.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Building the C API
        shell: bash -el {0}
        run: |
          source activate reaktoro
          cmake -S . -B .build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=.install \
            -DREAKTORO_BUILD_C_API=ON \
            -DREAKTORO_BUILD_PYTHON=OFF \
            -DREAKTORO_BUILD_TESTS=OFF \
            -DREAKTORO_BUILD_DOCS=OFF \
            -DREAKTORO_BUILD_EXAMPLES=OFF
          cmake --build .build --parallel
          cmake --install .build

      # The C API pulls in Reaktoro, which pulls in Optima, phreeqc4rkt, ThermoFun and the rest, all
      # of them shared libraries living in the conda environment. Walking the dependencies is the
      # only way to get the closure right: a hand-written list goes stale the first time a
      # dependency of a dependency changes.
      - name: Collecting the runtime
        shell: bash -el {0}
        run: |
          source activate reaktoro
          # pefile reads a PE import table without needing the Visual Studio tools; patchelf is what
          # rewrites an ELF's RPATH. Neither is a build dependency, only a packaging one.
          if [ "${{ runner.os }}" = "Windows" ]; then pip install pefile; fi
          if [ "${{ runner.os }}" = "Linux" ]; then conda install -y -c conda-forge patchelf; fi
          python scripts/collect_runtime.py --rid ${{ matrix.rid }} --prefix .install --out runtimes

      - name: Checking the library loads
        shell: bash -el {0}
        run: |
          source activate reaktoro
          python scripts/check_runtime.py --rid ${{ matrix.rid }} --dir runtimes/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: runtimes-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}
          if-no-files-found: error

  # One zip per runtime, on a release, because that is where DWSIM reads them from: its build
  # downloads the one runtime it needs rather than carrying a quarter of a gigabyte of binaries in
  # its own history. The tag is pinned on the DWSIM side, so republishing under a new tag is a
  # deliberate act rather than something a build picks up by surprise.
  publish:
    name: publish
    needs: build
    # Whatever built, gets published. One runtime failing or waiting forever on a scarce runner is
    # not a reason to withhold the four that are ready.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: runtimes-*
          path: runtimes

      - name: Zipping one archive per runtime
        run: |
          cd runtimes
          for d in runtimes-*; do
            rid="${d#runtimes-}"
            mv "$d" "$rid"
            (cd "$rid" && zip -qr "../reaktoro-$rid.zip" .)
            echo "$rid: $(du -h "reaktoro-$rid.zip" | cut -f1)"
          done

      - name: Publishing the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
                 --title "Reaktoro C API runtimes" \
                 --notes "The flat C API and its dependency closure, one archive per .NET runtime identifier. Built by .github/workflows/runtimes.yml."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber runtimes/reaktoro-*.zip
